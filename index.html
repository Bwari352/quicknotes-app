<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes App</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Your simple space for thoughts, tasks and study notes.</p>
    </header>

    <main>
      <section id="add-note-section">
        <h2>Add a Note</h2>
        <form id="add-note-form">
          <label for="note-input">Write your note:</label>
          <input
            type="text"
            id="note-input"
            placeholder="What would you like to remember"
            required
          />
          <label for="note-category">Select a category:</label>
          <select id="note-category" required>
            <option value="">--Choose a category--</option>
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
          </select>

          <button type="submit">Add Note</button>
        </form>

        <p id="error-message" role="alert"></p>
      </section>

      <section id="your-notes-section">
        <h2>Your Notes</h2>

        <label for="search-input">Search your notes:</label>
        <input type="text" id="search-input" placeholder="Search by notes" />
        <p id="note-count">You have no notes yet</p>
        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes App. All rights reserved.</p>
    </footer>
  </body>
</html>
